[project]
name = "auggie-harness"
version = "0.0.0"
description = "GTM-as-code harness: versioned strategy turned into an evidence-to-action-to-learning loop."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14,<3",
]

[project.scripts]
auggie = "auggie.cli:main"

[project.optional-dependencies]
mongodb = [
    "pymongo>=4.19,<5",
]
google = [
    "google-auth>=2.62",
    "requests>=2.34",
]

[dependency-groups]
dev = [
    "google-auth>=2.62",
    "mypy>=2.4",
    "pymongo>=4.19,<5",
    "pytest>=9.1",
    "requests>=2.34",
    "ruff>=0.17",
    "types-requests>=2.33.0.20261006",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "auggie"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py312"
# Fixtures are byte-exact (their digests are tested); never reformat them.
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
