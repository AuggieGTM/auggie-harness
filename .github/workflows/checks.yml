name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # Pinned: ubuntu-latest moves to a new release on its own schedule.
    runs-on: ubuntu-24.04
    services:
      # Official image, pulled by digest and never redistributed (ADR 0010, ADR 0015).
      # MongoDB 7.0: MongoDB 8 refuses to start on the runners' Linux kernel (6.19 or newer),
      # a known incompatibility (SERVER-121912). Move back to 8 once a release starts there.
      mongodb:
        image: mongo:7.0@sha256:c53852c00c23ca9f23fc39690350ffa9a80e3642fe8f96879726d8da0abe80a7 # 7.0.45
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The public-boundary test and gitleaks scan every commit.
          fetch-depth: 0
      - name: Scan history for secrets with gitleaks (pinned by checksum)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
      - name: Load the private denylist from a repository secret
        env:
          DENYLIST: ${{ secrets.AUGGIE_PUBLIC_DENYLIST }}
        run: |
          if [ -n "$DENYLIST" ]; then
            printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/public-denylist.txt"
            echo "AUGGIE_PUBLIC_DENYLIST=$RUNNER_TEMP/public-denylist.txt" >> "$GITHUB_ENV"
          else
            echo "::warning::AUGGIE_PUBLIC_DENYLIST is not set; private terms are not checked."
          fi
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run pytest
        env:
          # Runs the Store contract suite against MongoDB too; CI fails if it is missing.
          AUGGIE_TEST_MONGODB_URI: mongodb://localhost:27017
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
